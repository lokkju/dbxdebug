name: Release

# Builds and publishes a release to PyPI. yeet (yeet.yml) creates the vX.Y.Z
# tag and GitHub Release when its release PR merges; it does that with the
# release App's token, so the release starts this workflow (one created with
# GITHUB_TOKEN would not). hatch-vcs derives the package version from the tag
# at build time.
#
# The publish job stays in this file because PyPI's Trusted Publisher for
# dbxdebug names release.yml and the pypi environment; moving it means
# changing the publisher on PyPI first.

on:
  release:
    types: [published]
  # Recovery path. Rebuilds from an existing tag and republishes, for a
  # publish that failed for an environmental reason (a bad publisher/metadata
  # pairing, a PyPI outage). It never creates a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.3.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Full CI (lint + format + pyright + test matrix + build) gates the publish.
  # If anything here fails, the publish job below is skipped and nothing ships.
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbxdebug
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
      contents: write # upload built artifacts to the GitHub Release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # Full history + tags for hatch-vcs version
          persist-credentials: false

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.11"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
