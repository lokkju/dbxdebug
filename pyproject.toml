[project]
name = "dbxdebug"
dynamic = ["version"]
description = "Client library and CLI for DOSBox-X remote debug protocols (GDB and QMP)"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Polyform-Shield-1.0.0"
authors = [
    { name = "lokkju" }
]
keywords = ["dosbox", "dosbox-x", "debugging", "gdb", "qmp", "emulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]
dependencies = [
    "click>=8.0",
    "loguru>=0.7",
]

[project.scripts]
dbxdebug = "dbxdebug.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # These two floors match the `rev:` pins in .pre-commit-config.yaml on
    # purpose, and are bumped with them. Each tool runs twice against this
    # repo -- once as a commit hook, once as the resolved dev environment CI
    # uses -- and a floor low enough to resolve behind the hook lets the two
    # disagree about the same file (lokkju/dbxdebug#17).
    "ruff>=0.14.9",
    "pyright>=1.1.411",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dbxdebug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that launch a real DOSBox-X are excluded from every default run --
# including CI's `uv run pytest tests -v`, which has no emulator to launch,
# and a plain `uv run pytest` on a developer machine, which has one and must
# not start it unasked. Opt in with `uv run pytest -m integration tests`;
# most (but not all) of those tests live in tests/integration.
addopts = "-m 'not integration'"
markers = [
    "integration: launches a real DOSBox-X emulator; deselected unless `-m integration` is given",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Agent worktrees live under .claude/worktrees/ INSIDE this repo, so a bare
# `ruff check .` from the root lints other branches' in-progress code and
# reports their errors as this tree's. pyright already scopes itself via
# `include`; ruff needs telling.
extend-exclude = [
    ".claude",
    # ruff formats Python inside Markdown code blocks, and it wants to
    # restretch the aligned trailing comments in our docs samples. CI runs
    # `ruff format --check src/ tests/` and the pre-commit hook is scoped to
    # `types_or: [python, pyi]`, so neither ever saw this -- only a bare
    # `ruff format --check .` did, which made the repo look broken to anyone
    # running the obvious command. Excluded so all three agree.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/dbxdebug", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
